name: CI Manual

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Instalar dependências
        run: npm install

      - name: Executar testes de API via Controller
        run: npm run test-rest-controller

      - name: Subir a API
        run: npm start &

      - name: Subir a API GraphQL
        run: npm run start-graphql &

      - name: Esperar a API estar funcionando
        run: sleep 5

      - name: Criar .env
        run:  |
          echo "BASE_URL_REST=${{ secrets.BASE_URL_REST }}" >> .env
          echo "BASE_URL_GRAPHQL=${{ secrets.BASE_URL_GRAPHQL }}" >> .env

      - name: Executar os testes de API via HTTP
        run: npm run test-rest-external

      - name: Rodar os testes External de API GraphQL via HTTP
        run: npm run test-graphql-external

      - name: Instalar k6
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg ca-certificates
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Executar teste de performance com K6 e gerar relatório HTML
        run: |
          mkdir -p k6-report
          K6_WEB_DASHBOARD=true K6_WEB_DASHBOARD_PERIOD=2s K6_WEB_DASHBOARD_EXPORT=k6-report/html-report.html k6 run ./test/k6/create-expense.js

      - name: Publicar relatório K6 como artefato
        uses: actions/upload-artifact@v4
        with:
          name: k6-html-report
          path: k6-report/html-report.html
